<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>My CalCy</title>
  </head>
  <body>
    <main id="main-container">
      <div id="container-box">
        <div id="display">
          <div id="inputArea">
            <h3 id="inputs">Enter Values</h3>
            <h1 id="result"></h1>
          </div>
        </div>

        <div id="button-area">
          <div id="bttn-container">
            <div id="sci-bttn">
              <button></button>
              <button>%</button>
              <button>C</button>
              <button id="clr">AC</button>
            </div>
            <div id="operations">
              <div id="operands">
                <button class="nums">1</button>
                <button class="nums">2</button>
                <button class="nums">3</button>
                <button class="nums">4</button>
                <button class="nums">5</button>
                <button class="nums">6</button>
                <button class="nums">7</button>
                <button class="nums">8</button>
                <button class="nums">9</button>
                <button class="nums">0</button>
                <button class="nums"><b>.</b></button>
                <button class="equals">=</button>
              </div>
              <div id="operators">
                <button class="opr">-</button>
                <button class="opr">+</button>
                <button class="opr">/</button>
                <!-- <button>%</button>  -->
                <button class="opr">*</button> 
              </div>
            </div> 
          </div>
        </div>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
